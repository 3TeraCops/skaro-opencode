appId: dev.skaro.app
productName: Skaro
directories:
  buildResources: build
  output: release
files:
  - out/**
  - package.json
extraResources:
  - from: build/skaro-bundle.json
    to: skaro-bundle.json
  - from: build/icon.png
    to: icon.png
asarUnpack:
  - node_modules/@playwright/**
  - node_modules/playwright/**
  - node_modules/playwright-core/**
win:
  icon: build/icon.ico
  target: nsis
  signExecutable: false
mac:
  icon: build/icon.icns
  target: [dmg, zip]
  category: public.app-category.developer-tools
  # No publisher certificate; ad-hoc signing keeps Apple Silicon binaries runnable.
  identity: '-'
  hardenedRuntime: false
  notarize: false
linux:
  icon: build/icon.png
  target: AppImage
  category: Development
  executableName: skaro
artifactName: '${productName}-${version}-${os}-${arch}.${ext}'
publish:
  provider: github
  owner: dartdavros
  repo: skaro
  releaseType: release
